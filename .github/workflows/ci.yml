name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        distribution: [default]
        perl:
          - '5.44.0'
          - '5.42.3'
          - '5.40.5'
          - '5.38.5'
          - '5.36.3'
          - '5.34.3'
          - '5.32.1'
          - '5.30.3'
          - '5.28.3'
          - '5.26.3'
          - '5.24.4'
          - '5.22.4'
        include:
          # setup-perl's own Windows Perls 5.40+ are built against
          # msvcrt, the runner's gcc against UCRT, and XS modules that
          # mix both crash; Strawberry brings its Perl and gcc together
          - os: windows-latest
            distribution: strawberry
            perl: latest

    steps:
      # The patches in patches/ and the golden fixtures in t/fixtures/
      # must keep their LF line endings
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          distribution: ${{ matrix.distribution }}

      - name: Show Perl configuration
        run: perl -V

      # The make this Perl was built with (gmake on Windows)
      - name: Find make
        shell: perl {0}
        run: |
          use Config;
          open my $env, '>>', $ENV{GITHUB_ENV} or die "GITHUB_ENV: $!";
          print {$env} "MAKE=$Config{make}\n";

      # Makefile.PL needs ExtUtils::MakeMaker 7.12 (XSMULTI) to run at
      # all, and Perl 5.22 and 5.24 ship older ones. Declaring it in
      # CONFIGURE_REQUIRES is not enough: cpanm cannot read that before
      # Makefile.PL has run (Object::PadX::Enum's CI hit the same)
      - name: Bootstrap configure-time dependencies
        run: cpanm --notest "ExtUtils::MakeMaker~>=7.12"

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: ${{ env.MAKE }}

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: ${{ env.MAKE }} test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -vb t

  release-checks:
    name: Distribution check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: latest

      - name: Install declared dependencies
        run: cpanm --installdeps --notest .

      - name: Configure and build
        run: |
          perl Makefile.PL
          make

      # make images-check compares the figures pixel by pixel, and the
      # glyphs depend on the runner's FreeType and DejaVu Sans; it runs
      # in make release instead

      - name: Distribution builds and passes its tests
        run: make disttest
